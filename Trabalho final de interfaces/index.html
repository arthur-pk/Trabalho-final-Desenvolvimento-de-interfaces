<!DOCTYPE html>
<html lang = "pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style1.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
        <title> Final turn </title>
    </head>
        <body>
            <img src="imagens/final_turn_transparent.png" alt="Título do Site">
            <main class="tela-inicial">
                <form id="login-form" class="painel" autocomplete="off" novalidate>
                    <div class="campo">
                        <label for="usuario">Nome de usuário:</label>
                        <input type="text" id="usuario" name="usuario" maxlength="20" autocomplete="off" required>
                    </div>
                    <div class="campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" maxlength="20" autocomplete="off" required>
                    </div>

                    <p id="erro" class="erro" role="alert"></p>

                    <button type="submit" id="btn-play">Jogar</button>
                </form>
            </main>
            <script src="formsinicial.js"></script>
        </body>
</html>
